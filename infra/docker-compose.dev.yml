name: paseo-aranjuez

# Override de desarrollo: `docker compose -f infra/docker-compose.yml -f infra/docker-compose.dev.yml up -d`
# Añade semillas, puerto de BD solo en loopback y adaptadores de consola.

services:
  db:
    ports:
      - "127.0.0.1:${DB_DEV_PORT:-5432}:5432" # solo loopback; nunca publicar la BD (INFRASTRUCTURE.md §3)

  migrate:
    environment:
      FLYWAY_LOCATIONS: filesystem:/flyway/sql,filesystem:/flyway/seed
    volumes:
      - ./migrations:/flyway/sql:ro
      - ./seed:/flyway/seed:ro

  api:
    environment:
      OTP_SENDER: console # dev: OTP por log
      EMAIL_SENDER: smtp # correo real vía SmtpEmailSender (sin Mailpit, decisión 03/10/2026); usa `console` si no tienes credenciales
